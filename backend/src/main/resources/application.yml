spring:
  application:
    name: qvs
  datasource:
    url: ${QVS_DB_URL:jdbc:postgresql://localhost:5432/qvs}
    username: ${QVS_DB_USER:qvs}
    password: ${QVS_DB_PASSWORD:qvs}
  jpa:
    hibernate:
      # NFR-05 / S03: Flyway owns the schema. `validate` means schema drift fails startup
      # instead of Hibernate quietly "fixing" a production database.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${QVS_REDIS_HOST:localhost}
      port: ${QVS_REDIS_PORT:6379}
      timeout: 500ms
  web:
    resources:
      # Where the console lives. The Dockerfile's web stage writes it to /app/static, outside
      # the jar, so a console-only change does not force a backend rebuild. The classpath
      # location is kept first so that running the API outside a container still behaves --
      # setting this property replaces Spring's defaults rather than adding to them, and
      # scoping it to the prod profile only meant Compose (which runs `dev`) served nothing.
      static-locations: classpath:/static/,file:/app/static/
  servlet:
    multipart:
      # FR-02. Spring's default ceiling is 1 MB per file, which a large graduation cohort
      # would cross -- roughly 10 000 rows -- and crossing it produced a 500 rather than an
      # answer. Stated explicitly so the limit is a decision an operator can see and raise,
      # not a framework default nobody chose. 10 MB is about 100 000 rows.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    # S09: uniform, uninformative error bodies. Stack traces and framework messages are an
    # information leak on a surface strangers can reach.
    include-message: never
    include-stacktrace: never

management:
  # The actuator's port is deliberately NOT set here. Unset means "the application's port",
  # which is what every test and every local run needs -- and a literal default cannot say
  # that, because under @SpringBootTest(RANDOM_PORT) the application's port is not known until
  # it binds. Writing `${PORT:8080}` here looked equivalent and was not: in tests it put the
  # actuator on 8080 while the application listened somewhere else, and the probes 404'd.
  #
  # Compose sets MANAGEMENT_SERVER_PORT=9090 in the environment instead, so the actuator gets
  # a port of its own there. Prometheus holds no bearer token and cannot obtain one, and the
  # alternative was serving metrics on the same port as the application: they disclose request
  # rates, error counts, JVM internals and the shape of the deployment, which is exactly the
  # reconnaissance the health endpoint was already caught handing out.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Without this, `http_server_requests_seconds` is a count, a sum and a max -- and no
      # buckets. Every histogram_quantile() over it returns nothing, so the NFR-01 latency
      # panel and the alert that watches it would have drawn empty charts and been read as
      # good news. Micrometer does not emit buckets unless asked, and nothing complains.
      percentiles-histogram:
        http.server.requests: true
      # Explicit boundaries at the figures this system is judged on: the 400 ms NFR-01 target
      # with a spread either side, so the quantile at the target is interpolated between close
      # buckets rather than across a wide one.
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,400ms,1s,2s
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

qvs:
  vault:
    # Where private signing material lives. In the image this is a mounted volume, never a
    # layer in the image itself -- keys baked into an image are keys published to a registry.
    directory: ${QVS_VAULT_DIR:./.vault}
  crypto:
    # No defaults. A missing secret must stop the application from starting rather than
    # silently falling back to something a repository could contain.
    field-key: ${QVS_FIELD_KEY}
    national-id-salt: ${QVS_NATIONAL_ID_SALT}
    ip-salt: ${QVS_IP_SALT}
    jwt-secret: ${QVS_JWT_SECRET}
  token:
    default-ttl-days: 30
    max-ttl-days: 180
  rate-limit:
    # FR-11: the 61st request from one address inside a minute is refused with 429.
    verify-per-minute: 60
    report-per-minute: 10
  bootstrap:
    # The first administrator, created at start-up only when the register holds no accounts at
    # all. Without this a deployment on the prod profile comes up with an empty user table and
    # no way to sign in: every other account is created by an administrator, and there was no
    # way to create the first one.
    #
    # No defaults, like every other credential here. Absent is a legitimate state -- a system
    # that already has accounts needs neither value, and leaving them set afterwards would be
    # leaving a credential in the environment for nothing.
    admin-email: ${QVS_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${QVS_BOOTSTRAP_ADMIN_PASSWORD:}
  anomaly:
    # What the agent considers unusual. Set for a demo register, and deliberately low enough
    # that the behaviour can be demonstrated -- a real deployment would raise them after
    # watching a fortnight of ordinary traffic, which is the only honest way to choose them.
    #
    # Neither number is a threshold for action. The agent reports; a person decides. An
    # employer checking a shortlist and somebody working through stolen tokens produce the
    # same shape, and a system that blocked on this would deny service to the people it exists
    # to serve, automatically and at scale.
    scan-window-minutes: 15
    unknown-tokens-per-client: 10
    distinct-credentials-per-client: 25

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Local development and the Compose demo: seeded data and a talkative health endpoint.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      # `always` here meant "to anyone at all", including the unauthenticated caller the
      # aggregate health endpoint used to be reachable by. `when-authorized` keeps the detail
      # useful to an operator holding a token and uninteresting to everyone else.
      show-details: when-authorized
