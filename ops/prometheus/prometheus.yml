# Prometheus scrape configuration for the Compose demo.
#
# The API is scraped on its management port (9090), which docker-compose.yml deliberately does
# not publish. Prometheus reaches it over the Compose network by service name; nothing outside
# that network can. Metrics are not public data — request rates, error counts, JVM internals and
# the shape of a deployment are all useful to somebody deciding what to attack.

global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: compose-demo

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qvs-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:9090']
        labels:
          service: qvs-api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
