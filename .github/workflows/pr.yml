# PR pipeline (S11). Every job here is a merge blocker via branch protection.
# It never deploys -- publishing and delivery belong to main.yml.
name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ---------------------------------------------- stages 1-3 + 5: JVM build
  backend:
    name: Backend build, test, analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # Sonar needs full history for new-code detection

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Stage 1 build, 2 lint (Checkstyle), 3 unit + ArchUnit, 5 analyse (SpotBugs, JaCoCo).
      # One `check` invocation so a local `./gradlew check` reproduces CI exactly.
      - name: Build, lint, test, verify coverage
        run: ./gradlew :backend:check --no-daemon --stacktrace

      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :backend:sonar --no-daemon

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.sha }}
          path: |
            backend/build/reports/jacoco/**
            backend/build/reports/tests/**
            backend/build/reports/checkstyle/**
            backend/build/reports/spotbugs/**
          if-no-files-found: warn

  # -------------------------------------------------- stage 4: integration
  integration:
    name: Integration tests (Testcontainers, real PostgreSQL 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # These run against a real postgres:16 container, so they exercise the actual
      # Flyway migrations and the actual SQL -- including the append-only trigger,
      # which an in-memory database would silently not have.
      - name: Integration tests
        run: ./gradlew :backend:integrationTest --no-daemon --stacktrace

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ github.sha }}
          path: backend/build/reports/tests/integrationTest/**
          if-no-files-found: warn

  # ------------------------------------------------------ stages 1-3: web
  frontend:
    name: Frontend build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect console
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ not present yet; skipping (walking skeleton, week 1)"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Formatting
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------ stage 6: scan
  scan:
    name: Secrets, dependencies and config scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks scans history, not just the diff

      # The single most common way student projects leak credentials (S09).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NFR-04: zero critical, zero high. Filesystem mode covers the dependency tree;
      # the image itself is scanned again in main.yml after it is built.
      - name: Trivy (dependencies and IaC)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table

  # --------------------------------- automated verification of requirements
  traceability:
    name: Requirement traceability matrix
    needs: [backend, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Decision 11-A: the matrix is a build task, not a document. It fails when an FR
      # has no covering test, which is what turns "automated verification of requirements"
      # from a claim into a gate.
      - name: Generate traceability report
        run: ./gradlew :backend:traceabilityReport --no-daemon

      - name: Comment matrix on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.number }} -F backend/build/reports/traceability/traceability.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-${{ github.sha }}
          path: backend/build/reports/traceability/**
          if-no-files-found: warn
