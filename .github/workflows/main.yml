# Main pipeline (S11). Re-verifies the merged tree, publishes one image by digest, and
# delivers: staging automatically, production behind a manual approval. That approval is
# what makes this continuous *delivery* rather than continuous deployment.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false      # never cancel a deploy mid-flight

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/qvs-api

jobs:
  # Stages 1-6 again, on the merged tree, with no cache reuse. A PR that was green
  # against a stale main can still be red once squashed onto it.
  verify:
    name: Re-verify merged tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - run: ./gradlew :backend:check :backend:integrationTest --no-daemon --rerun-tasks

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-verification-${{ github.sha }}
          path: backend/build/reports/**
          if-no-files-found: warn

  publish:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # NFR-04 again, this time against the assembled image rather than the source tree.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      # Deploys the digest, never a tag. `latest` can move underneath you; a digest cannot.
      - name: Deploy
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}"
          echo "::notice::Terraform-driven deploy lands with the IaC bonus work (S15)"

  deploy-production:
    name: Deploy to production
    needs: [publish, deploy-staging]
    runs-on: ubuntu-latest
    # The gate. GitHub holds the job until a required reviewer approves the environment,
    # and the same digest that passed staging is what goes out.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Deploy approved digest
        run: |
          echo "Promoting ${{ needs.publish.outputs.digest }} to production"
